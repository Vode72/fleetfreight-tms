services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetfreight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
      POSTGRES_DB: ${POSTGRES_DB:-fleetfreight}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      # Production-safe base. Development settings live in docker-compose.override.yml, which
      # Compose reads automatically; production runs use `-f docker-compose.yml` only.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Comma-separated reverse proxy addresses whose X-Forwarded-For is trusted. Empty: none.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      LOG_HMAC_KEY: ${LOG_HMAC_KEY:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fleetfreight}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}@db:5432/${POSTGRES_DB:-fleetfreight}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
